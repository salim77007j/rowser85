[package]
name = "rowser-networking"
description = "Rrowser networking: HTTP/1.1, HTTP/2, HTTP/3 (QUIC), TLS 1.3, DoH/DoT, WebSockets."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
cookie = "0.18.2"
futures-util = "0.3.34"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hickory-resolver = { version = "0.25.2", features = ["tokio", "https-ring", "quic-ring", "tls-ring", "webpki-roots"] }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "ring", "webpki-roots", "rustls-native-certs", "native-tokio"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "http1", "http2", "service"] }
percent-encoding = "2.3.2"
quinn = "0.11.12"
rowser-privacy = { path = "../privacy" }
rowser-storage = { path = "../storage" }
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring", "logging", "tls12"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1.44"
url = "2.5.8"
