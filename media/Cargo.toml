[package]
name = "rowser-media"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror = "2"
ringbuf = "0.4"

[features]
default = ["audio-cpal"]
audio-cpal = ["dep:cpal"]

# Video decode (H.264): Cisco openh264. Decoders are optional at runtime.
[dependencies.openh264]
version = "0.8"

[dependencies.symphonia-core]
version = "0.5"

[dependencies.symphonia-codec-aac]
version = "0.5"

[dependencies.cpal]
version = "0.15"
optional = true
