[package]
name = "rowser-ui"
description = "Rrowser85 native browser UI (egui)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rowser"
path = "src/main.rs"

[dependencies]
rowser-shell = { path = "../integration" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "tracing-log"] }
rowser-api = { path = "../api" }
rowser-engine = { path = "../engine" }
anyhow = "1.0.104"
eframe = "0.32.3"
dirs = "5"
egui = "0.32"
