[package]
name = "rowser-js"
description = "Rrowser JS: QuickJS-ng runtime and Web API bindings."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rowser-parsing = { path = "../parsing" }
rowser-privacy = { path = "../privacy" }
rowser-storage = { path = "../storage" }
base64 = "0.23.1"
rowser-dom = { path = "../dom" }
rquickjs = { version = "0.14.0", features = ["classes", "properties", "array-buffer", "futures", "loader"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
url = "2.5.8"
tracing = "0.1.44"
